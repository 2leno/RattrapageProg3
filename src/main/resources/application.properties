spring.application.name=kofia

# L'application doit repondre sur le port 8080
server.port=8080

# Connexion PostgreSQL utilisee par la classe DbConnection.
# Adaptez ces trois valeurs a votre installation locale si necessaire.
kofia.datasource.url=jdbc:postgresql://localhost:5432/kofia
kofia.datasource.username=postgres
kofia.datasource.password=postgres

# Renvoie un corps JSON lisible en cas d'erreur non geree.
server.error.include-message=always
